name: Publish modern image

# Builds the fork off the CURRENT upstream base (deploy/Dockerfile, v2.3.x layout).
# Publishes extra tags inside the existing package, so `:latest` keeps pointing at the
# proven 2.1.3 image until the new one passes a real Vast smoke test.

on:
  push:
    branches: [modern]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: publish-modern-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/eddlm/mooshieuiexperiments:next
            ghcr.io/eddlm/mooshieuiexperiments:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
