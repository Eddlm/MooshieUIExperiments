name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space for Docker build
        run: |
          sudo apt-get remove -y 'dotnet-*' 'llvm-*' 'ghc-*' 'azure-*' || true
          sudo docker system prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/eddlm/mooshieuiexperiments:latest
            ghcr.io/eddlm/mooshieuiexperiments:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/eddlm/mooshieuiexperiments:buildcache
          cache-to: type=registry,ref=ghcr.io/eddlm/mooshieuiexperiments:buildcache,mode=max,ignore-error=true